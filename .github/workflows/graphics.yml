name: Generate graphics
on:
  push:
    branches:
      - main
    paths:
      - 'graphics-generator/**'
      - 'results/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    types: [assigned, opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'graphics-generator/**'
  workflow_dispatch:

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Workaround testsuite locale issue
  LANG: en_US.UTF-8

permissions:
  contents: write
  pull-requests: write

jobs:
  build-test-generate:
    name: "Build & Generate graphics"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: graphics-generator
        run: ./mvnw -B verify
      - name: Ensure source directory exists
        run: mkdir -p results
      - name: Generate graphics
        run: |
          rm -rf images
          mkdir images
          java -jar graphics-generator/target/quarkus-app/quarkus-run.jar results images true
      - name: Commit generated resources via PR
        if: github.repository == 'quarkusio/benchmarks' && endsWith(github.ref, '/main') && github.event_name != 'pull_request'
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          git add images/
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping PR creation"
            exit 0
          fi
          
          # Create a new branch with short commit hash
          BRANCH_NAME="create-images/sourceref-$(git rev-parse --short HEAD)"
          git checkout -b "$BRANCH_NAME"
          
          # Commit changes
          git commit -m "Generate charts (from ${{ github.workflow }} run # ${{ github.run_number }})"
          
          # Push the branch
          git push origin "$BRANCH_NAME"
          
          # Create pull request
          PR_URL=$(gh pr create \
            --title "Generate charts (from ${{ github.workflow }} run # ${{ github.run_number }})" \
            --body "Generated performance images from [${{ github.workflow }} run # ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), which was triggered by commit ${{ github.sha }}." \
            --label "Generated Resources" \
            --base main)
          
          # Output PR URL for next step
          echo "pull-request-url=$PR_URL" >> $GITHUB_OUTPUT
      - name: Merge PR
        if: steps.create-pr.outputs.pull-request-url && github.repository == 'quarkusio/benchmarks' && endsWith(github.ref, '/main') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --merge --delete-branch "${{ steps.create-pr.outputs.pull-request-url }}"
      - name: Publish latest images for inspection
        if: github.repository == 'quarkusio/benchmarks' && ! endsWith(github.ref, '/main') && github.event_name == 'pull_request'
        id: artifact-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: ./images/tuned/*svg
          retention-days: 3
      - name: Save PR number
        if: github.repository == 'quarkusio/benchmarks' && ! endsWith(github.ref, '/main') && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p ./pr
          echo $PR_NUMBER > ./pr/pr_number
      - uses: actions/upload-artifact@v7
        if: github.repository == 'quarkusio/benchmarks' && ! endsWith(github.ref, '/main') && github.event_name == 'pull_request'
        with:
          name: pr_number
          path: pr/